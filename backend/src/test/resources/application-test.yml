datasources:
  default:
    # Keep backend tests self-contained so `./gradlew test` does not depend on
    # a separately running Postgres container.
    url: jdbc:h2:mem:seatly-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
    schema-generate: CREATE_DROP
    dialect: H2
    db-type: h2

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop

flyway:
  datasources:
    default:
      enabled: false
